name: Windows and macOS trial
on:
  push:
    branches: [trial/macos]
    paths: [main.py, backend.py, mac_backend.py, mac_ui.py, download_ui.py, signing.py, ui_assets.py, tool_downloads.py, Build_Studio.ps1, Build_Studio_Mac.sh, requirements.txt, 'tests/**', 'assets/**']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            name: Windows
          - os: macos-15
            name: Mac-AppleSilicon
          - os: macos-15-intel
            name: Mac-Intel
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-java@v4
        if: runner.os == 'macOS'
        with:
          distribution: temurin
          java-version: '21'
      - name: Build Mac
        if: runner.os == 'macOS'
        run: bash Build_Studio_Mac.sh
      - name: Mac tests and real build smoke
        if: runner.os == 'macOS'
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          .venv-mac/bin/python -m unittest discover -s tests -q
          .venv-mac/bin/python tests/mac_smoke.py
          mac_dist/ExeBuilderStudio.app/Contents/MacOS/ExeBuilderStudio --ebs-ui-smoke
          hdiutil verify mac_installer/ExeBuilderStudio.dmg
          ditto -c -k --keepParent mac_dist/ExeBuilderStudio.app mac_installer/ExeBuilderStudio.app.zip
          mv mac_installer/ExeBuilderStudio.dmg mac_installer/ExeBuilderStudio-${{ matrix.name }}.dmg
          shasum -a 256 mac_installer/* > mac_installer/SHA256SUMS.txt
      - name: Build Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./Build_Studio.ps1 -CreateInstaller
          if ($LASTEXITCODE -ne 0) { throw 'Build failed' }
          ./.venv/Scripts/python.exe -m unittest discover -s tests -q
          if ($LASTEXITCODE -ne 0) { throw 'Tests failed' }
        env:
          QT_QPA_PLATFORM: offscreen
      - uses: actions/upload-artifact@v4
        with:
          name: ExeBuilderStudio-${{ matrix.name }}-1.0.0-trial
          path: |
            mac_installer/*
            installer_output/ExeBuilderStudio_Setup.exe
          if-no-files-found: error
  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: packages
      - name: Publish separate trial release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=trial-macos-${GITHUB_RUN_NUMBER}
          mapfile -t files < <(find packages -type f \( -name '*.dmg' -o -name '*.exe' \))
          test "${#files[@]}" -eq 3
          sha256sum "${files[@]}" | sed 's@  .*/@  @' > SHA256SUMS.txt
          gh release create "$tag" "${files[@]}" SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease --title 'ExeBuilderStudio 1.0.0 Windows + macOS trial' --notes 'Experimental cross-platform build. Not Apple notarized. Apple Silicon and Intel packages are separate. Stable v1.0.0 is unchanged.'
