name: Temporary macOS DMG build

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: temporary-macos-dmg-build
  cancel-in-progress: true

jobs:
  build-macos-dmg:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Build macOS app and DMG
        run: bash macos/build_macos_distribution.sh

      - name: Upload DMG for download
        uses: actions/upload-artifact@v4
        with:
          name: ExeBuilderStudio-macOS-AppleSilicon-DMG
          path: |
            macos_release/*.dmg
            macos_release/*.dmg.sha256
          if-no-files-found: error
          retention-days: 1

      - name: Remove temporary and legacy Actions workflows after successful build
        if: success()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/temporary-macos-build.yml .github/workflows/windows-release.yml
          git commit -m "chore: remove temporary GitHub Actions workflows after macOS build"
          git -c http.extraheader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64)" push
