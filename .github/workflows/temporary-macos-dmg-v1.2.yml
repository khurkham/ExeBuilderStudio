name: Temporary macOS DMG build v1.2

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-dmg:
    name: Build DMG (${{ matrix.arch_label }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch_label: Apple-Silicon-arm64
          - runner: macos-15-intel
            arch_label: Intel-x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45

    steps:
      - name: Check out main source
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify native runner architecture
        shell: bash
        run: |
          set -euo pipefail
          echo "Runner: ${{ matrix.arch_label }}"
          uname -a
          python3 --version
          case "${{ matrix.arch_label }}" in
            Apple-Silicon-arm64) test "$(uname -m)" = "arm64" ;;
            Intel-x86_64) test "$(uname -m)" = "x86_64" ;;
          esac

      - name: Build standard DMG
        shell: bash
        env:
          EBS_INSTALLER_MODE: Standard
        run: bash macos/build_macos_distribution.sh

      - name: Verify DMG and checksum exist
        shell: bash
        run: |
          set -euo pipefail
          ls -lh macos_release/
          compgen -G "macos_release/*.dmg" >/dev/null
          compgen -G "macos_release/*.dmg.sha256" >/dev/null
          shasum -a 256 macos_release/*.dmg
          cat macos_release/*.dmg.sha256

      - name: Upload one-time build artifact (keep 1 day)
        uses: actions/upload-artifact@v4
        with:
          name: ExeBuilderStudio-v1.2-DMG-${{ matrix.arch_label }}
          path: |
            macos_release/*.dmg
            macos_release/*.dmg.sha256
          if-no-files-found: error
          retention-days: 1
