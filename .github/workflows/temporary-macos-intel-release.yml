name: Temporary macOS Intel DMG (run once)

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing GitHub Release tag to attach the Intel DMG to"
        required: true
        default: "v1.1"

permissions:
  contents: write

jobs:
  build-intel-dmg:
    # Intel-hosted macOS runner is required to produce a native x86_64 app.
    runs-on: macos-13
    steps:
      - name: Check out selected release source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build native Intel DMG
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = "x86_64"
          bash macos/build_macos_distribution.sh
          test -f "macos_release/ExeBuilderStudio-1.1-macOS-x86_64.dmg"
          shasum -a 256 "macos_release/ExeBuilderStudio-1.1-macOS-x86_64.dmg" > "macos_release/ExeBuilderStudio-1.1-macOS-x86_64.dmg.sha256"

      - name: Upload Intel DMG to existing release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          gh release upload "$RELEASE_TAG" \
            macos_release/ExeBuilderStudio-1.1-macOS-x86_64.dmg \
            macos_release/ExeBuilderStudio-1.1-macOS-x86_64.dmg.sha256 \
            --clobber

      - name: Remove this temporary workflow after successful publication
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/temporary-macos-intel-release.yml
          git commit -m "Remove one-time macOS Intel release workflow"
          git push
