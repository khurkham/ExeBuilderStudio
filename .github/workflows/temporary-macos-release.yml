name: Temporary macOS DMG release (run once)

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: temporary-macos-release
  cancel-in-progress: true

jobs:
  build-publish-cleanup:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Build native macOS DMG
        run: bash macos/build_macos_distribution.sh

      - name: Publish DMG and checksum to the matching GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="$(python -c "from app.services.tool_downloads import APP_VERSION; print(APP_VERSION)")"
          TAG="v$VERSION"
          DMG="$(find macos_release -maxdepth 1 -type f -name "ExeBuilderStudio-$VERSION-macOS-*.dmg" -print -quit)"
          if [[ -z "$DMG" || ! -f "$DMG" ]]; then
            echo "ERROR: No version-matched DMG was produced."
            exit 1
          fi
          shasum -a 256 "$DMG" > "$DMG.sha256"
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY"
          gh release upload "$TAG" "$DMG" "$DMG.sha256" --clobber --repo "$GITHUB_REPOSITORY"

      - name: Remove this temporary macOS workflow after successful publication
        if: success()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/temporary-macos-release.yml
          git commit -m "chore: remove temporary macOS release workflow after publishing DMG"
          git -c http.extraheader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64)" push origin HEAD:main
