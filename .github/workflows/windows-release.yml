name: Windows installer and online updates
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [tool_downloads.py, .github/workflows/windows-release.yml]
permissions:
  contents: write
concurrency:
  group: windows-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Build Windows installer
        shell: pwsh
        run: |
          python -m venv .venv
          if ($LASTEXITCODE -ne 0) { throw 'Cannot create environment' }
          ./Build_Studio.ps1 -CreateInstaller
      - name: Test application
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          ./.venv/Scripts/python.exe -m unittest discover -s tests -q
          if ($LASTEXITCODE -ne 0) { throw 'Tests failed' }
      - name: Publish verified installer
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = & ./.venv/Scripts/python.exe -c "from tool_downloads import APP_VERSION; print(APP_VERSION)"
          $tag = "v$version"
          gh release view $tag --repo $env:GITHUB_REPOSITORY 2>$null
          if ($LASTEXITCODE -eq 0) { throw 'Release already exists. Increase APP_VERSION and installer AppVersion before publishing a new version.' }
          $setup = 'installer_output/ExeBuilderStudio_Setup.exe'
          $hash = (Get-FileHash $setup -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  ExeBuilderStudio_Setup.exe" | Set-Content installer_output/SHA256SUMS.txt -Encoding ascii
          gh release create $tag $setup installer_output/SHA256SUMS.txt --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "ExeBuilderStudio $version" --notes 'Windows x64 installer. Includes embedded Shan and Thai fonts, Windows icons, direct tool downloads and in-app online updates.' --latest
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed' }
