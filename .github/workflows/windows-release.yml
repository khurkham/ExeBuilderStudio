name: Windows installer and online updates
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [tool_downloads.py, .github/workflows/windows-release.yml, 'assets/**', 'tests/**']
permissions:
  contents: write
concurrency:
  group: windows-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Build Windows installer
        shell: pwsh
        run: |
          python -m venv .venv
          if ($LASTEXITCODE -ne 0) { throw 'Cannot create environment' }
          ./Build_Studio.ps1 -CreateInstaller
      - name: Test application
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          ./.venv/Scripts/python.exe -m unittest discover -s tests -q
          if ($LASTEXITCODE -ne 0) { throw 'Tests failed' }
      - name: Publish verified installer
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = & ./.venv/Scripts/python.exe -c "from tool_downloads import APP_VERSION; print(APP_VERSION)"
          $tag = "v$version"
          gh release view $tag --repo $env:GITHUB_REPOSITORY 2>$null
          $exists = $LASTEXITCODE -eq 0
          if ($exists -and $version -ne '1.0.0') { throw 'Release already exists. Increase APP_VERSION before publication.' }
          $setup = 'installer_output/ExeBuilderStudio_Setup.exe'
          $hash = (Get-FileHash $setup -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  ExeBuilderStudio_Setup.exe" | Set-Content installer_output/SHA256SUMS.txt -Encoding ascii
          $revision = & ./.venv/Scripts/python.exe -c "from tool_downloads import BUILD_REVISION; print(BUILD_REVISION)"
          $notes = "Version $version. Build revision: $revision. Fix Windows PowerShell discovery for SDK verification and wrapped text/button layout."
          if ($exists) {
            gh release upload $tag $setup installer_output/SHA256SUMS.txt --clobber --repo $env:GITHUB_REPOSITORY
            if ($LASTEXITCODE -ne 0) { throw 'Release upload failed' }
            gh api --method PATCH "repos/$env:GITHUB_REPOSITORY/git/refs/tags/$tag" -f sha=$env:GITHUB_SHA -F force=true
            if ($LASTEXITCODE -ne 0) { throw 'Release tag update failed' }
            gh release edit $tag --repo $env:GITHUB_REPOSITORY --title "ExeBuilderStudio $version" --notes $notes --latest
            if ($LASTEXITCODE -ne 0) { throw 'Release edit failed' }
            exit 0
          }
          gh release create $tag $setup installer_output/SHA256SUMS.txt --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "ExeBuilderStudio $version" --notes $notes --latest
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed' }
